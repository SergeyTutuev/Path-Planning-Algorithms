world:
  height: 50
  width: 50
  collision_mode: 'unobstructed_obstacles'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.4}
    state: [5, 5, 0]
    vel_max: [1.5, 8.0]
    vel_min: [-1.5, -8.0]
    goal_threshold: 0.7
    behavior:
      name: 'rvo'
      #vxmax: 1.2
      #vymax: 1.2
      
      acce: 0.5
      decel: 0.7
      factor: 5.0
      neighbor_threshold: 2.5
      allow_backward: True
      backward_penalty: 0.1
      save_marg: 0.1

      rad_approx: 0.1  
      rad_approx_overlap: 0.6
      rad_approx_range: 3.0
    sensors:
      - name: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.28
        number: 300
    plot: {show_trajectory: True, show_goal: True}

obstacle:
  - number: 75
    distribution: {name: 'random', range_low: [0, 8, -3.14], range_high: [50, 43, 3.14]}
    shape:
      name: 'polygon'
      random_shape: true
      avg_radius_range: [1.0, 2.5]
      num_vertices_range: [4, 7]
      irregularity_range: [0.2, 0.6]
      spikeyness_range: [0, 0.2]
      is_convex: false